name: Lab problem
description: A lab step fails, the expected result differs, or the portal UI has changed.
title: "[Lab]: "
labels: ["lab", "triage"]
body:
  - type: input
    id: lab
    attributes:
      label: Lab ID
      placeholder: LAB-2.01
    validations:
      required: true
  - type: input
    id: step
    attributes:
      label: Step number
      placeholder: Step 4
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include error codes and the portal path you used. Redact tenant names, IDs, and user names.
    validations:
      required: true
  - type: dropdown
    id: env
    attributes:
      label: Lab environment
      options:
        - Microsoft 365 E5 trial
        - Microsoft 365 Developer Program sandbox
        - Paid tenant (test)
        - Other
