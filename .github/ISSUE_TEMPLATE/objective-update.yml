name: Exam objective update
description: Microsoft changed the MD-102 skills measured, or a feature was renamed/retired.
title: "[Objectives]: "
labels: ["objectives", "triage"]
body:
  - type: input
    id: date
    attributes:
      label: Study guide "Skills measured as of" date
      placeholder: October 27, 2026
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What changed?
      description: Paste the added/removed/reworded bullet(s) from the official study guide change log.
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link
      value: https://learn.microsoft.com/credentials/certifications/resources/study-guides/md-102
