name: Objective coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check every objective has a doc and a lab, and the map is current
        run: |
          DOMAINS="$(tr -d '[:space:]' < .github/scripts/enforced-domains.txt)"
          python3 .github/scripts/check_coverage.py --check-map --domains "$DOMAINS"
