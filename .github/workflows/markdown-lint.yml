name: Markdown lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdown-lint.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/markdown-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Prebundled action: no npm install at run time, so registry hiccups can't break the build
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
